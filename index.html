<h1>一符之緣 影片上傳工具</h1>
<p>這是一個個人使用的小工具，用來把我自己製作的短影片，排程上傳到我自己的 YouTube 頻道「一符之緣」。</p>
<p>它只會在我授權後，使用 YouTube 的影片上傳權限，操作我自己的頻道；不對外提供服務，也不處理其他人的帳號。</p>
<p><a href="privacy.html">隱私權政策</a></p>
<p>This is a personal tool that schedules the owner's own short videos to the owner's own YouTube channel. It is not offered to the public.</p>
